<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AshCalc - Modern Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">ṇ
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
  <div class="background-decor">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">AshCalc</span>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme (Dark / Light)" aria-label="Toggle Theme">
          <span class="theme-icon">🌙</span>
        </button>
        <button id="historyToggleBtn" class="icon-btn" title="Toggle History Panel" aria-label="Toggle History">
          <span class="icon">📜</span>
        </button>
        <button id="soundToggleBtn" class="icon-btn active" title="Toggle Sound Feedback" aria-label="Toggle Sound">
          <span class="sound-icon">🔊</span>
        </button>
      </div>
    </header>

    <div class="calculator-card">
      <!-- Mode Tabs -->
      <nav class="mode-tabs" role="tablist">
        <button class="tab-btn active" data-mode="standard" role="tab" aria-selected="true">Standard</button>
        <button class="tab-btn" data-mode="scientific" role="tab" aria-selected="false">Scientific</button>
      </nav>

      <!-- Calculator Display -->
      <section class="display-container" aria-live="polite">
        <div class="history-preview" id="expressionDisplay" title="Current Expression">&nbsp;</div>
        <div class="main-display-row">
          <div class="display-value" id="resultDisplay">0</div>
          <button id="copyBtn" class="copy-btn" title="Copy to clipboard" aria-label="Copy result">
            <span class="copy-icon">📋</span>
            <span class="copy-tooltip">Copied!</span>
          </button>
        </div>
      </section>

      <!-- Keypad Layout -->
      <section class="keypad-container" id="keypad">
        <!-- Scientific Panel (hidden in standard mode) -->
        <div class="scientific-panel" id="scientificPanel">
          <button class="btn btn-sci" data-action="toggle-angle" id="angleUnitBtn" title="Toggle Angle: Degrees / Radians">DEG</button>
          <button class="btn btn-sci" data-action="2nd" id="secondFnBtn" title="2nd Functions">2nd</button>
          <button class="btn btn-sci" data-action="pi" title="Pi (3.14159...)">π</button>
          <button class="btn btn-sci" data-action="e" title="Euler's constant (2.71828...)">e</button>

          <button class="btn btn-sci fn-primary" data-action="sin" title="Sine">sin</button>
          <button class="btn btn-sci fn-alt hidden" data-action="asin" title="Inverse Sine">sin⁻¹</button>
          
          <button class="btn btn-sci fn-primary" data-action="cos" title="Cosine">cos</button>
          <button class="btn btn-sci fn-alt hidden" data-action="acos" title="Inverse Cosine">cos⁻¹</button>

          <button class="btn btn-sci fn-primary" data-action="tan" title="Tangent">tan</button>
          <button class="btn btn-sci fn-alt hidden" data-action="atan" title="Inverse Tangent">tan⁻¹</button>

          <button class="btn btn-sci" data-action="sqrt" title="Square Root">√</button>

          <button class="btn btn-sci fn-primary" data-action="square" title="Square (x²)">x²</button>
          <button class="btn btn-sci fn-alt hidden" data-action="cube" title="Cube (x³)">x³</button>

          <button class="btn btn-sci" data-action="power" title="Power (x^y)">xʸ</button>
          
          <button class="btn btn-sci fn-primary" data-action="log" title="Logarithm base 10">log</button>
          <button class="btn btn-sci fn-alt hidden" data-action="pow10" title="10 to the power of x">10ˣ</button>

          <button class="btn btn-sci fn-primary" data-action="ln" title="Natural Logarithm">ln</button>
          <button class="btn btn-sci fn-alt hidden" data-action="exp" title="e to the power of x">eˣ</button>

          <button class="btn btn-sci" data-action="fact" title="Factorial (n!)">n!</button>
          <button class="btn btn-sci" data-action="abs" title="Absolute Value (|x|)">|x|</button>
          <button class="btn btn-sci" data-action="open-paren" title="Open Parenthesis">(</button>
          <button class="btn btn-sci" data-action="close-paren" title="Close Parenthesis">)</button>
        </div>

        <!-- Standard Keys Grid -->
        <div class="standard-grid">
          <!-- Row 1 -->
          <button class="btn btn-danger" data-action="clear-all" title="Clear All (Escape)">AC</button>
          <button class="btn btn-secondary" data-action="backspace" title="Backspace (Backspace)">⌫</button>
          <button class="btn btn-secondary" data-action="percent" title="Percentage (%)">%</button>
          <button class="btn btn-operator" data-action="operator" data-val="/" title="Divide (/)">÷</button>

          <!-- Row 2 -->
          <button class="btn btn-num" data-val="7">7</button>
          <button class="btn btn-num" data-val="8">8</button>
          <button class="btn btn-num" data-val="9">9</button>
          <button class="btn btn-operator" data-action="operator" data-val="*" title="Multiply (*)">×</button>

          <!-- Row 3 -->
          <button class="btn btn-num" data-val="4">4</button>
          <button class="btn btn-num" data-val="5">5</button>
          <button class="btn btn-num" data-val="6">6</button>
          <button class="btn btn-operator" data-action="operator" data-val="-" title="Minus (-)">−</button>

          <!-- Row 4 -->
          <button class="btn btn-num" data-val="1">1</button>
          <button class="btn btn-num" data-val="2">2</button>
          <button class="btn btn-num" data-val="3">3</button>
          <button class="btn btn-operator" data-action="operator" data-val="+" title="Add (+)">+</button>

          <!-- Row 5 -->
          <button class="btn btn-secondary" data-action="negate" title="Negate sign (±)">±</button>
          <button class="btn btn-num" data-val="0">0</button>
          <button class="btn btn-num" data-val=".">.</button>
          <button class="btn btn-accent" data-action="equals" title="Calculate (Enter)">=</button>
        </div>
      </section>

      <!-- History Sliding Drawer -->
      <aside class="history-drawer" id="historyDrawer" aria-hidden="true">
        <div class="history-header">
          <h3>Calculation History</h3>
          <div class="history-actions">
            <button id="clearHistoryBtn" class="text-btn" title="Clear all history">Clear</button>
            <button id="closeHistoryBtn" class="icon-btn" title="Close history" aria-label="Close">✕</button>
          </div>
        </div>
        <div class="history-list" id="historyList">
          <div class="empty-history">No calculations yet</div>
        </div>
      </aside>
    </div>

    <footer class="app-footer">
      <p>💡 Tip: You can use your keyboard! Numbers, <code>+ - * / %</code>, <code>Enter</code> to calculate, <code>Esc</code> to clear.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
